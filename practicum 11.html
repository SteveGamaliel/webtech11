<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Bridge - Validated Service Order</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
      color: #243b53;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1, h2 { color: #102a43; text-align: center; }

    .intro { text-align: center; }

    .services {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .service {
      overflow: hidden;
      padding-bottom: 12px;
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      text-align: center;
    }

    .service img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .service h3 { margin: 10px 6px 4px; }

    .price {
      margin: 4px;
      color: #087e8b;
      font-weight: bold;
    }

    .quantity {
      width: 80%;
      padding: 8px;
    }

    form {
      max-width: 650px;
      margin: 24px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px #102a4315;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: bold;
    }

    .customer-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #9fb3c8;
      border-radius: 4px;
      font: inherit;
    }

    .error {
      min-height: 1.2em;
      margin: 3px 0;
      color: #b42318;
      font-size: 0.9rem;
    }

    .total {
      margin-top: 18px;
      padding: 12px;
      background: #e8f5e9;
      color: #176b35;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 5px;
      background: #087e8b;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button[type="reset"] { background: #52677d; }

    .result {
      min-height: 1.5em;
      color: #176b35;
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 760px) {
      .services { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .services { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Finance Bridge</h1>
    <p class="intro">Select financial services and submit the form to see JavaScript validation.</p>

    <form id="orderForm" novalidate>
      <h2>Choose Services</h2>

      <div class="services">
        <article class="service">
          <img src="gallery-1.png" alt="Financial market analysis">
          <h3>Financial Planning</h3>
          <p class="price">₹500 per session</p>
          <label for="planningQty">Number of sessions</label>
          <input class="quantity" id="planningQty" type="number"
                 min="0" step="1" value="0" data-price="500">
        </article>

        <article class="service">
          <img src="gallery-2.png" alt="Financial charts and reports">
          <h3>Investment Advisory</h3>
          <p class="price">₹750 per session</p>
          <label for="investmentQty">Number of sessions</label>
          <input class="quantity" id="investmentQty" type="number"
                 min="0" step="1" value="0" data-price="750">
        </article>

        <article class="service">
          <img src="gallery-3.png" alt="Investment market chart">
          <h3>Retirement Planning</h3>
          <p class="price">₹650 per session</p>
          <label for="retirementQty">Number of sessions</label>
          <input class="quantity" id="retirementQty" type="number"
                 min="0" step="1" value="0" data-price="650">
        </article>

        <article class="service">
          <img src="gallery-4.png" alt="Financial growth planning">
          <h3>Tax Planning</h3>
          <p class="price">₹400 per session</p>
          <label for="taxQty">Number of sessions</label>
          <input class="quantity" id="taxQty" type="number"
                 min="0" step="1" value="0" data-price="400">
        </article>
      </div>

      <h2>Customer Details</h2>

      <label for="customerName">Full Name</label>
      <input class="customer-input" id="customerName" type="text"
             autocomplete="name" required>
      <p class="error" id="nameError"></p>

      <label for="customerEmail">Email Address</label>
      <input class="customer-input" id="customerEmail" type="email"
             autocomplete="email" required>
      <p class="error" id="emailError"></p>

      <label for="customerPhone">Phone Number</label>
      <input class="customer-input" id="customerPhone" type="tel"
             autocomplete="tel" required>
      <p class="error" id="phoneError"></p>

      <p class="error" id="servicesError"></p>

      <div class="total">
        Total Price: <span id="totalPrice">₹0</span>
      </div>

      <div class="buttons">
        <button type="submit">Place Request</button>
        <button type="reset">Clear Form</button>
      </div>

      <p class="result" id="resultMessage" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("orderForm");
    const quantityInputs = document.querySelectorAll(".quantity");
    const totalPrice = document.getElementById("totalPrice");
    const resultMessage = document.getElementById("resultMessage");

    function updateTotal() {
      let total = 0;

      quantityInputs.forEach(input => {
        const quantity = Number(input.value);
        const price = Number(input.dataset.price);

        if (Number.isInteger(quantity) && quantity > 0) {
          total += quantity * price;
        }
      });

      totalPrice.textContent = "₹" + total;
      return total;
    }

    function showError(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      input.setAttribute("aria-invalid", message ? "true" : "false");
    }

    function validateForm() {
      let isValid = true;

      const name = document.getElementById("customerName");
      const email = document.getElementById("customerEmail");
      const phone = document.getElementById("customerPhone");

      const nameMessage = name.value.trim().length < 2
        ? "Enter your name using at least 2 characters."
        : "";

      const emailMessage = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())
        ? ""
        : "Enter a valid email address.";

      const phoneDigits = phone.value.replace(/\D/g, "");
      const phoneMessage = phoneDigits.length < 10
        ? "Enter a phone number with at least 10 digits."
        : "";

      showError(name, "nameError", nameMessage);
      showError(email, "emailError", emailMessage);
      showError(phone, "phoneError", phoneMessage);

      if (nameMessage || emailMessage || phoneMessage) {
        isValid = false;
      }

      let selectedService = false;

      quantityInputs.forEach(input => {
        const quantity = Number(input.value);
        const invalid = !Number.isInteger(quantity) || quantity < 0;

        input.setAttribute("aria-invalid", invalid ? "true" : "false");

        if (invalid) isValid = false;
        if (quantity > 0 && !invalid) selectedService = true;
      });

      const servicesError = document.getElementById("servicesError");
      servicesError.textContent = selectedService
        ? ""
        : "Select at least one service by entering a quantity.";

      if (!selectedService) isValid = false;

      return isValid;
    }

    quantityInputs.forEach(input => {
      input.addEventListener("input", () => {
        updateTotal();
        resultMessage.textContent = "";
      });
    });

    ["customerName", "customerEmail", "customerPhone"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        validateForm();
        resultMessage.textContent = "";
      });
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (!validateForm()) {
        resultMessage.textContent = "Please correct the highlighted fields.";
        return;
      }

      const total = updateTotal();
      resultMessage.textContent =
        "Thank you! Your Finance Bridge request is ready. Total: ₹" + total;
    });

    form.addEventListener("reset", () => {
      setTimeout(() => {
        document.querySelectorAll(".error").forEach(error => error.textContent = "");
        document.querySelectorAll("[aria-invalid]").forEach(input =>
          input.removeAttribute("aria-invalid")
        );
        totalPrice.textContent = "₹0";
        resultMessage.textContent = "";
      }, 0);
    });
  </script>
</body>
</html>
